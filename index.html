<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>QR and Barcode Reader</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:clamp(12px,4vw,28px)}main{width:min(100%,680px);padding:clamp(18px,4vw,34px);background:#fff;border:1px solid #dce3ee;border-radius:20px;box-shadow:0 16px 40px #1c2a421a}h1{margin:0 0 8px;font-size:clamp(1.6rem,5vw,2.2rem);text-align:center}.intro{margin:0 0 22px;color:#58657a;text-align:center}button{width:100%;min-height:50px;border:0;border-radius:12px;padding:12px 18px;background:#1769e0;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:hover{background:#0f57bd}button:disabled{opacity:.65}.camera{position:relative;margin-top:20px;overflow:hidden;border-radius:14px;background:#080b10;aspect-ratio:4/3}.camera[hidden]{display:none}.camera video{width:100%;height:100%;display:block;object-fit:cover}.guide{position:absolute;left:10%;right:10%;top:35%;height:30%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 999px #0005;pointer-events:none}.message{margin-top:20px;padding:16px;border-radius:12px;background:#edf3fc;overflow-wrap:anywhere}.message strong{display:block;margin-bottom:6px}.success{background:#e5f7eb;color:#14532d}.error{background:#fdeaea;color:#8b1e1e}@media(prefers-color-scheme:dark){:root{color:#edf3ff;background:#101622}main{background:#182131;border-color:#303d52}.intro{color:#b9c4d7}.message{background:#253147}.success{background:#163b27;color:#baf3cc}.error{background:#482326;color:#ffd0d0}}
</style></head><body><main><h1>QR and Barcode Reader</h1><p class="intro">Press the button and point the camera at a QR code or barcode.</p><button id="action" type="button">Read Code</button><div id="camera" class="camera" hidden><video id="video" playsinline muted></video><div class="guide"></div></div><div id="message" class="message" role="status" aria-live="polite">Camera has not been started.</div></main><script>
const button=document.querySelector('#action'),camera=document.querySelector('#camera'),video=document.querySelector('#video'),message=document.querySelector('#message');let stream,running=false,frameId,detector,busy=false;
const names={qr_code:'QR Code',ean_13:'EAN-13',ean_8:'EAN-8',upc_a:'UPC-A',upc_e:'UPC-E',code_128:'Code 128',code_39:'Code 39',code_93:'Code 93',codabar:'Codabar',itf:'ITF',data_matrix:'Data Matrix',pdf417:'PDF417',aztec:'Aztec'};
function show(title,text,type=''){message.className=('message '+type).trim();message.replaceChildren();const b=document.createElement('strong'),s=document.createElement('span');b.textContent=title;s.textContent=text;message.append(b,s)}
function stop(){running=false;cancelAnimationFrame(frameId);stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;camera.hidden=true;button.disabled=false;button.textContent='Read Code'}
async function scan(){if(!running)return;if(!busy&&video.readyState>=2){busy=true;try{const codes=await detector.detect(video);if(codes.length){const c=codes[0];stop();show('Code read successfully',c.rawValue+' ('+(names[c.format]||c.format)+')','success');return}}catch(e){console.warn(e)}finally{busy=false}}frameId=requestAnimationFrame(scan)}
async function start(){if(!window.isSecureContext){show('Secure connection required','Open this page over HTTPS or localhost.','error');return}if(!navigator.mediaDevices?.getUserMedia){show('Camera unavailable','This browser does not provide camera access.','error');return}if(!('BarcodeDetector'in window)){show('Scanner unavailable','This browser does not support the built-in code reader. Desktop support is limited.','error');return}button.disabled=true;button.textContent='Starting camera...';try{const supported=await BarcodeDetector.getSupportedFormats();const wanted=['qr_code','ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','codabar','itf','data_matrix','pdf417','aztec'];const enabled=wanted.filter(x=>supported.includes(x));if(!enabled.length)throw Error('No supported formats');detector=new BarcodeDetector({formats:enabled});stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});video.srcObject=stream;await video.play();running=true;camera.hidden=false;button.disabled=false;button.textContent='Stop camera';show('Camera is active','Keep the entire code inside the guide. Supported on this device: '+enabled.map(x=>names[x]||x).join(', '));scan()}catch(e){stop();show('Camera could not be started','Check browser support, permission, HTTPS, and whether the camera is already in use.','error');console.error(e)}}
button.addEventListener('click',()=>running?(stop(),show('Camera stopped','Press Read Code to try again.')):start());window.addEventListener('pagehide',stop);
</script></body></html>
