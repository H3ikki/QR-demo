<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR and Barcode Scanner</title><script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>:root{font-family:system-ui;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:20px}main{width:min(100%,680px);background:#fff;padding:clamp(20px,5vw,36px);border-radius:20px;box-shadow:0 16px 40px #0002}h1,p{text-align:center}button{width:100%;padding:14px;border:0;border-radius:12px;background:#1769e0;color:white;font:inherit;font-weight:700}#reader{margin-top:20px;overflow:hidden;border-radius:14px}.result{margin-top:20px;padding:16px;border-radius:12px;background:#edf3fc;overflow-wrap:anywhere}.success{background:#e5f7eb;color:#14532d}.error{background:#fdeaea;color:#8b1e1e}.result strong{display:block;margin-bottom:6px}.row{display:grid;grid-template-columns:8rem 1fr;gap:8px;margin-top:6px}@media(max-width:450px){.row{grid-template-columns:1fr;gap:2px}}</style></head><body><main><h1>QR and Barcode Scanner</h1><p>Read QR codes and common barcodes with the camera.</p><button id="action">Read Code</button><div id="reader"></div><div id="result" class="result" role="status" aria-live="polite">Camera has not been started.</div></main><script>
const btn=document.querySelector('#action'),out=document.querySelector('#result');let scanner,running=false,locked=false;
const formats=['QR_CODE','EAN_13','EAN_8','UPC_A','UPC_E','CODE_128','CODE_39','CODE_93','CODABAR','ITF','DATA_MATRIX','PDF_417','AZTEC'];
function msg(html,type=''){out.className=('result '+type).trim();out.innerHTML=html}
function esc(v){const e=document.createElement('div');e.textContent=v;return e.innerHTML}
async function stop(){if(!scanner||!running)return;running=false;try{await scanner.stop();await scanner.clear()}catch(e){}btn.textContent='Read Code'}
async function start(){if(!window.isSecureContext){msg('<strong>Secure connection required</strong>Use HTTPS or localhost.','error');return}if(typeof Html5Qrcode==='undefined'){msg('<strong>Scanner unavailable</strong>The embedded scanner component could not be loaded.','error');return}btn.disabled=true;btn.textContent='Starting camera...';const enabled=formats.map(x=>Html5QrcodeSupportedFormats[x]).filter(Number.isInteger);scanner=new Html5Qrcode('reader',{formatsToSupport:enabled,useBarCodeDetectorIfSupported:true,verbose:false});try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.min(w*.8,420),height:Math.min(h*.45,220)}),aspectRatio:1.333},async(text,result)=>{if(locked)return;locked=true;const stamp=new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'medium'}).format(new Date());const type=result?.result?.format?.formatName||'Unknown';await stop();msg('<strong>Code read successfully</strong><div class="row"><b>Data</b><span>'+esc(text)+'</span></div><div class="row"><b>Type</b><span>'+esc(type)+'</span></div><div class="row"><b>Read at</b><time>'+esc(stamp)+'</time></div>','success');locked=false},()=>{});running=true;btn.disabled=false;btn.textContent='Stop camera';msg('<strong>Camera is active</strong>Keep the entire code inside the scanning area.')}catch(e){btn.disabled=false;btn.textContent='Read Code';msg('<strong>Camera could not be started</strong>Check camera permission, HTTPS and whether another application is using the camera.','error')}}
btn.addEventListener('click',async()=>running?stop():start());window.addEventListener('pagehide',()=>{if(running)stop()});
</script></body></html>
