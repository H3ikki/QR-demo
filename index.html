<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>QR and Barcode Reader</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:clamp(12px,4vw,28px)}main{width:min(100%,680px);padding:clamp(18px,4vw,34px);background:#fff;border:1px solid #dce3ee;border-radius:20px;box-shadow:0 16px 40px #1c2a421a}h1{margin:0 0 8px;font-size:clamp(1.6rem,5vw,2.2rem);text-align:center}.intro{margin:0 0 22px;color:#58657a;text-align:center}button{min-height:46px;border:0;border-radius:12px;padding:10px 16px;background:#1769e0;color:#fff;font:inherit;font-weight:700;cursor:pointer}#action{width:100%;min-height:50px;padding:12px 18px}button:hover{background:#0f57bd}button:disabled{opacity:.65}.secondary{background:#536176}.secondary:hover{background:#414d60}.camera{position:relative;margin-top:20px;overflow:hidden;border-radius:14px;background:#080b10;aspect-ratio:4/3}.camera[hidden]{display:none}.camera video{width:100%;height:100%;display:block;object-fit:cover}.guide{position:absolute;left:10%;right:10%;top:35%;height:30%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 999px #0005;pointer-events:none}.message{margin-top:20px;padding:16px;border-radius:12px;background:#edf3fc;overflow-wrap:anywhere}.message strong{display:block;margin-bottom:6px}.success{background:#e5f7eb;color:#14532d}.error{background:#fdeaea;color:#8b1e1e}.history{margin-top:26px;padding-top:22px;border-top:1px solid #dce3ee}.history-header{display:flex;align-items:center;justify-content:space-between;gap:12px}.history h2{margin:0;font-size:1.2rem}.history-list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}.history-item{padding:13px 14px;border:1px solid #dce3ee;border-radius:12px;background:#f8faff}.history-value{font-weight:700;overflow-wrap:anywhere}.history-meta{margin-top:5px;color:#667286;font-size:.88rem}.empty{color:#667286;padding:8px 0}.clear{width:auto;min-height:38px;padding:7px 12px;font-size:.9rem}@media(max-width:420px){.history-header{align-items:stretch;flex-direction:column}.clear{width:100%}}@media(prefers-color-scheme:dark){:root{color:#edf3ff;background:#101622}main{background:#182131;border-color:#303d52}.intro,.empty,.history-meta{color:#b9c4d7}.message{background:#253147}.success{background:#163b27;color:#baf3cc}.error{background:#482326;color:#ffd0d0}.history{border-color:#303d52}.history-item{background:#202b3e;border-color:#303d52}}
</style>
</head>
<body>
<main>
<h1>QR and Barcode Reader</h1>
<p class="intro">Press the button and point the camera at a QR code or barcode.</p>
<button id="action" type="button">Read Code</button>
<div id="camera" class="camera" hidden><video id="video" playsinline muted></video><div class="guide"></div></div>
<div id="message" class="message" role="status" aria-live="polite">Camera has not been started.</div>
<section class="history" aria-labelledby="history-title">
<div class="history-header"><h2 id="history-title">Scan History</h2><button id="clearHistory" class="secondary clear" type="button">Clear History</button></div>
<ul id="historyList" class="history-list"></ul>
</section>
</main>
<script>
const button=document.querySelector('#action'),camera=document.querySelector('#camera'),video=document.querySelector('#video'),message=document.querySelector('#message'),historyList=document.querySelector('#historyList'),clearHistoryButton=document.querySelector('#clearHistory');
let stream,running=false,frameId,detector,busy=false;
const STORAGE_KEY='barcode-reader-history-v1',MAX_HISTORY=50;
const names={qr_code:'QR Code',ean_13:'EAN-13',ean_8:'EAN-8',upc_a:'UPC-A',upc_e:'UPC-E',code_128:'Code 128',code_39:'Code 39',code_93:'Code 93',codabar:'Codabar',itf:'ITF',data_matrix:'Data Matrix',pdf417:'PDF417',aztec:'Aztec'};
function show(title,text,type=''){message.className=('message '+type).trim();message.replaceChildren();const b=document.createElement('strong'),s=document.createElement('span');b.textContent=title;s.textContent=text;message.append(b,s)}
function loadHistory(){try{const value=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(value)?value:[]}catch{return[]}}
function saveHistory(items){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(items))}catch(e){console.warn('History could not be saved',e)}}
function renderHistory(){const items=loadHistory();historyList.replaceChildren();clearHistoryButton.disabled=!items.length;if(!items.length){const li=document.createElement('li');li.className='empty';li.textContent='No scans yet.';historyList.append(li);return}for(const item of items){const li=document.createElement('li');li.className='history-item';const value=document.createElement('div');value.className='history-value';value.textContent=item.value;const meta=document.createElement('div');meta.className='history-meta';meta.textContent=(item.format||'Unknown format')+' · '+new Date(item.timestamp).toLocaleString();li.append(value,meta);historyList.append(li)}}
function addToHistory(value,format){const items=loadHistory();items.unshift({value,format,timestamp:new Date().toISOString()});saveHistory(items.slice(0,MAX_HISTORY));renderHistory()}
function stop(){running=false;cancelAnimationFrame(frameId);stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;camera.hidden=true;button.disabled=false;button.textContent='Read Code'}
async function scan(){if(!running)return;if(!busy&&video.readyState>=2){busy=true;try{const codes=await detector.detect(video);if(codes.length){const c=codes[0],format=names[c.format]||c.format;addToHistory(c.rawValue,format);stop();show('Code read successfully',c.rawValue+' ('+format+')','success');return}}catch(e){console.warn(e)}finally{busy=false}}frameId=requestAnimationFrame(scan)}
async function start(){if(!window.isSecureContext){show('Secure connection required','Open this page over HTTPS or localhost.','error');return}if(!navigator.mediaDevices?.getUserMedia){show('Camera unavailable','This browser does not provide camera access.','error');return}if(!('BarcodeDetector'in window)){show('Scanner unavailable','This browser does not support the built-in code reader. Desktop support is limited.','error');return}button.disabled=true;button.textContent='Starting camera...';try{const supported=await BarcodeDetector.getSupportedFormats();const wanted=['qr_code','ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','codabar','itf','data_matrix','pdf417','aztec'];const enabled=wanted.filter(x=>supported.includes(x));if(!enabled.length)throw Error('No supported formats');detector=new BarcodeDetector({formats:enabled});stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});video.srcObject=stream;await video.play();running=true;camera.hidden=false;button.disabled=false;button.textContent='Stop camera';show('Camera is active','Keep the entire code inside the guide. Supported on this device: '+enabled.map(x=>names[x]||x).join(', '));scan()}catch(e){stop();show('Camera could not be started','Check browser support, permission, HTTPS, and whether the camera is already in use.','error');console.error(e)}}
button.addEventListener('click',()=>running?(stop(),show('Camera stopped','Press Read Code to try again.')):start());
clearHistoryButton.addEventListener('click',()=>{localStorage.removeItem(STORAGE_KEY);renderHistory();show('History cleared','Stored scan history has been removed from this browser.')});
window.addEventListener('pagehide',stop);
renderHistory();
</script>
</body>
</html>
