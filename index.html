<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1420"><meta name="color-scheme" content="dark"><link rel="manifest" href="./manifest.webmanifest"><title>Offline QR and Barcode Scanner POC</title><script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#edf3ff;background:#0d1420;--panel:#172131;--panel2:#202c3f;--border:#34445d;--muted:#b5c0d1;--blue:#62a0ff;--green:#163a28;--greenText:#baf3cc;--amber:#493817;--amberText:#ffe3a3;--red:#482326;--redText:#ffd0d0}*{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:clamp(12px,4vw,28px)}main{width:min(100%,820px);padding:clamp(20px,5vw,38px);background:var(--panel);border:1px solid var(--border);border-radius:22px;box-shadow:0 18px 50px #0006}h1{margin:0 0 8px;text-align:center;font-size:clamp(1.65rem,5vw,2.3rem)}h2{margin:28px 0 12px;font-size:1.15rem}.intro{text-align:center;color:var(--muted);margin:0 0 20px}.statusbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.status{padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--panel2)}.status span{display:block;color:var(--muted);font-size:.82rem}.status strong{display:block;margin-top:4px}.online{color:var(--greenText)}.offline{color:var(--amberText)}.buttons{display:grid;grid-template-columns:1fr auto;gap:10px}button{min-height:50px;border:0;border-radius:12px;padding:12px 18px;background:var(--blue);color:#07111f;font:inherit;font-weight:800;cursor:pointer}button.secondary{background:#647086;color:#fff}button.danger{background:#8b3b43;color:#fff;min-height:38px;padding:7px 12px}button:disabled{opacity:.55}.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;padding:12px 14px;background:var(--panel2);border:1px solid var(--border);border-radius:12px}.toggle small{display:block;color:var(--muted);margin-top:3px}.switch{position:relative;width:48px;height:28px;flex:0 0 48px}.switch input{position:absolute;opacity:0}.slider{position:absolute;inset:0;border-radius:99px;background:#647086}.slider:before{content:"";position:absolute;width:20px;height:20px;left:4px;top:4px;border-radius:50%;background:#fff;transition:.2s}.switch input:checked+.slider{background:var(--blue)}.switch input:checked+.slider:before{transform:translateX(20px)}#reader{margin-top:20px;overflow:hidden;border-radius:14px;background:#05080d}.message{margin-top:20px;padding:16px;border-radius:12px;background:var(--panel2);overflow-wrap:anywhere}.message strong{display:block;margin-bottom:7px}.success{background:var(--green);color:var(--greenText)}.warning{background:var(--amber);color:var(--amberText)}.error{background:var(--red);color:var(--redText)}.row{display:grid;grid-template-columns:7rem 1fr;gap:8px;margin-top:6px}#snapshotWrap[hidden]{display:none}#snapshot{display:block;width:100%;max-height:420px;object-fit:contain;border:1px solid var(--border);border-radius:14px}.caption,.meta{color:var(--muted);font-size:.9rem}.history-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.history{display:grid;gap:10px;padding:0;margin:0;list-style:none}.history li{padding:13px 14px;background:var(--panel2);border:1px solid var(--border);border-radius:12px}.item-top{display:flex;justify-content:space-between;gap:12px}.data{font-weight:750;overflow-wrap:anywhere}.badge{border-radius:999px;padding:3px 9px;font-size:.78rem;font-weight:750}.pending{background:var(--amber);color:var(--amberText)}.synced{background:var(--green);color:var(--greenText)}.empty{color:var(--muted);font-style:italic}@media(max-width:600px){.statusbar{grid-template-columns:1fr}.buttons{grid-template-columns:1fr}.row{grid-template-columns:1fr}.item-top{flex-direction:column}.badge{align-self:flex-start}}
</style></head><body><main><h1>Offline QR and Barcode Scanner POC</h1><p class="intro">Scans are stored locally first and simulated as synced whenever the device is online.</p><div class="statusbar"><div class="status"><span>Connection</span><strong id="connection">Checking...</strong></div><div class="status"><span>Waiting to sync</span><strong id="pendingCount">0</strong></div><div class="status"><span>Last sync</span><strong id="lastSync">Never</strong></div></div><div class="toggle"><div><strong>Keep last successful image</strong><small>Image stays only in memory.</small></div><label class="switch"><input id="keepImage" type="checkbox"><span class="slider"></span></label></div><div class="buttons"><button id="action">Read Code</button><button id="syncNow" class="secondary">Sync now</button></div><div id="reader"></div><div id="result" class="message" role="status" aria-live="polite">Preparing offline support...</div><section id="snapshotWrap" hidden><h2>Last successful image</h2><img id="snapshot" alt="Latest scan frame"><p id="snapshotTime" class="caption"></p></section><section><div class="history-head"><h2>History</h2><button id="clearSynced" class="danger">Clear synced</button></div><ol id="history" class="history"></ol></section></main><script>
const DB='offline-scanner-poc',STORE='scans',VER=1,$=s=>document.querySelector(s),button=$('#action'),syncButton=$('#syncNow'),output=$('#result'),connection=$('#connection'),pendingCount=$('#pendingCount'),lastSync=$('#lastSync'),historyList=$('#history'),keepImage=$('#keepImage'),snapshotWrap=$('#snapshotWrap'),snapshot=$('#snapshot'),snapshotTime=$('#snapshotTime');let scanner,running=false,locked=false,syncing=false;const formatNames=['QR_CODE','EAN_13','EAN_8','UPC_A','UPC_E','CODE_128','CODE_39','CODE_93','CODABAR','ITF','DATA_MATRIX','PDF_417','AZTEC'];
function db(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function put(x){const d=await db();return new Promise((ok,no)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(x);t.oncomplete=()=>{d.close();ok()};t.onerror=()=>no(t.error)})}async function all(){const d=await db();return new Promise((ok,no)=>{const r=d.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>{d.close();ok(r.result.sort((a,b)=>b.scannedAt.localeCompare(a.scannedAt)))};r.onerror=()=>no(r.error)})}const uid=()=>crypto.randomUUID?.()||Date.now()+'-'+Math.random();function esc(v){const e=document.createElement('div');e.textContent=String(v);return e.innerHTML}function msg(x,c=''){output.className=('message '+c).trim();output.innerHTML=x}function status(){connection.textContent=navigator.onLine?'Online':'Offline';connection.className=navigator.onLine?'online':'offline';syncButton.disabled=!navigator.onLine||syncing}async function render(){const xs=await all();pendingCount.textContent=xs.filter(x=>x.status!=='synced').length;historyList.replaceChildren();if(!xs.length){const li=document.createElement('li');li.className='empty';li.textContent='No scans yet.';historyList.append(li)}for(const x of xs.slice(0,50)){const li=document.createElement('li'),top=document.createElement('div'),data=document.createElement('div'),badge=document.createElement('span'),meta=document.createElement('div');top.className='item-top';data.className='data';badge.className='badge '+x.status;meta.className='meta';data.textContent=x.value;badge.textContent=x.status==='synced'?'Synced':'Waiting';meta.textContent=x.format+' · '+new Date(x.scannedAt).toLocaleString();top.append(data,badge);li.append(top,meta);historyList.append(li)}}async function queue(value,format){const now=new Date();await put({id:uid(),value,format,scannedAt:now.toISOString(),status:'pending'});await render();if(navigator.onLine)sync();return now}async function sync(){if(syncing||!navigator.onLine)return;syncing=true;status();for(const x of (await all()).filter(x=>x.status!=='synced').reverse()){if(!navigator.onLine)break;await new Promise(r=>setTimeout(r,250));x.status='synced';x.syncedAt=new Date().toISOString();await put(x)}lastSync.textContent=new Date().toLocaleString();syncing=false;status();await render()}function capture(stamp){if(!keepImage.checked)return;const v=$('#reader video');if(!v?.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);snapshot.src=c.toDataURL('image/jpeg',.82);snapshotTime.textContent='Captured '+stamp;snapshotWrap.hidden=false}async function stop(){if(!scanner||!running)return;running=false;try{await scanner.stop();await scanner.clear()}catch(e){console.warn(e)}button.disabled=false;button.textContent='Read Code'}
async function start(){if(typeof Html5Qrcode==='undefined'){msg('<strong>Scanner unavailable</strong>Library not loaded or cached.','error');return}button.disabled=true;button.textContent='Starting camera...';locked=false;const formats=formatNames.map(n=>Html5QrcodeSupportedFormats[n]).filter(Number.isInteger);scanner=new Html5Qrcode('reader',{formatsToSupport:formats,useBarCodeDetectorIfSupported:false,verbose:false});try{await scanner.start({facingMode:'environment'},{fps:15,qrbox:(width,height)=>{const scanWidth=Math.min(Math.floor(width*.92),520,width-8),scanHeight=Math.min(Math.floor(height*.38),190,height-8);return{width:Math.max(60,scanWidth),height:Math.max(40,scanHeight)}},aspectRatio:1.777778,disableFlip:false},async(text,result)=>{if(locked)return;locked=true;const type=result?.result?.format?.formatName||'Unknown',now=await queue(text,type),stamp=now.toLocaleString();capture(stamp);await stop();msg('<strong>Code stored locally</strong><div class="row"><b>Data</b><span>'+esc(text)+'</span></div><div class="row"><b>Type</b><span>'+esc(type)+'</span></div><div class="row"><b>Read at</b><span>'+esc(stamp)+'</span></div>','success');locked=false},()=>{});running=true;button.disabled=false;button.textContent='Stop camera';msg('<strong>Camera is active</strong>Keep the complete code inside the scanning area.')}catch(error){console.error('Camera start failed:',error);button.disabled=false;button.textContent='Read Code';msg('<strong>Camera could not be started</strong>'+esc((error?.name||'Error')+': '+(error?.message||String(error))),'error')}}
button.onclick=async()=>running?stop():start();syncButton.onclick=sync;$('#clearSynced').onclick=async()=>{const xs=await all(),d=await db();const t=d.transaction(STORE,'readwrite'),s=t.objectStore(STORE);xs.filter(x=>x.status==='synced').forEach(x=>s.delete(x.id));t.oncomplete=()=>{d.close();render()}};addEventListener('online',()=>{status();sync()});addEventListener('offline',()=>{status();msg('<strong>Offline mode</strong>Scans remain safely queued.','warning')});addEventListener('beforeunload',e=>{if(+pendingCount.textContent){e.preventDefault();e.returnValue=''}});async function init(){status();await render();if('serviceWorker'in navigator)try{await navigator.serviceWorker.register('./service-worker.js')}catch(e){console.error('Service Worker registration failed:',e)}if(navigator.onLine)sync()}init();
</script></body></html>
